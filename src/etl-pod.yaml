apiVersion: v1
kind: Pod
metadata:
  name: elt-test
spec:
  containers:
    - name: my-etl-container
      image: my-etl-container
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          memory: 150M
          cpu: 100m
      envFrom: # using envFrom instead of env
        - configMapRef: # referencing the ConfigMap
            name: postgres-config