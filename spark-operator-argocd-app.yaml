apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubeflow.github.io/spark-operator
    targetRevision: HEAD  # or specify a version if needed
    chart: spark-operator
    helm:
      parameters:
        - name: webhook.enable
          value: "true"
        - name: webhook.port
          value: "443"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: spark-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true