apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      targetRevision: 1.14.0
      chart: airflow
      helm:
        valueFiles:
        - $values/airflow_src/values.yaml

    - repoURL: 'git@github.com:hnhonnguyen/spark-k8s.git'
      targetRevision: main
      ref: values

    
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true